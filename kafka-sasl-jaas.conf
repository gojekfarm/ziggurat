// JAAS config for the local SASL/SCRAM test broker (docker-compose-sasl.yml). No static
// credentials here - SCRAM's ScramLoginModule validates against credentials stored in
// the cluster's own metadata (provisioned via kafka-configs.sh, see
// .local-test-sasl/README.md), not a username/password baked into this file. Safe to
// commit for exactly that reason: there is no secret in it.
KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
