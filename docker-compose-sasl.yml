services:
  kafka:
    ports:
      - '9095:9095' # SASL_SCRAM listener, additive to the existing PLAINTEXT 9092
    environment:
      # Adds a third listener (SASL_SCRAM) alongside the existing PLAINTEXT/CONTROLLER
      # ones - PLAINTEXT stays up unauthenticated on 9092, so existing non-SASL
      # tests/harnesses are unaffected. Inter-broker and controller traffic stay on
      # their original listeners too.
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,SASL_SCRAM://:9095
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,SASL_SCRAM://localhost:9095
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SCRAM:SASL_PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # SASL_PLAINTEXT (not SASL_SSL) here - this is a local dev broker with no TLS
      # cert, so it isn't representative of the SASL_SSL default ziggurat-go's client
      # config uses in production; the harness README explains setting
      # SecurityProtocol=SecurityProtocolSASLPlaintext explicitly to match.
      - KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-256
      - KAFKA_LISTENER_NAME_SASL_SCRAM_SASL_ENABLED_MECHANISMS=SCRAM-SHA-256
      - KAFKA_LISTENER_NAME_SASL_SCRAM_SCRAM_SHA_256_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required;
